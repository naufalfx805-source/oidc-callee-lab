name: OIDC Identity Lab Reusable Callee

on:
  workflow_call:
    inputs:
      scenario:
        required: true
        type: string
      audience:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  callee_reusable:
    name: callee reusable OIDC capture
    runs-on: ubuntu-latest
    steps:
      - name: Capture callee reusable claims
        env:
          SCENARIO: ${{ inputs.scenario }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          set -euo pipefail
          mkdir -p oidc-claims
          cat > capture_oidc_claims.py <<'PY'
          import argparse
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          TARGET_KEYS = [
              "sub", "repository", "repository_id", "repository_owner",
              "repository_owner_id", "workflow_ref", "workflow_sha",
              "job_workflow_ref", "job_workflow_sha", "aud", "ref",
              "ref_type", "actor", "event_name", "run_id", "run_attempt",
              "check_run_id"
          ]

          def b64url_decode(value):
              value += "=" * (-len(value) % 4)
              return base64.urlsafe_b64decode(value.encode())

          parser = argparse.ArgumentParser()
          parser.add_argument("--audience", required=True)
          parser.add_argument("--out", required=True)
          args = parser.parse_args()

          req_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote(args.audience)
          req = urllib.request.Request(req_url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req, timeout=20) as resp:
              token = json.loads(resp.read())["value"]

          header_b64, payload_b64, _sig = token.split(".", 2)
          payload = json.loads(b64url_decode(payload_b64))
          selected = {k: payload.get(k) for k in TARGET_KEYS}
          selected["_captured_at"] = int(time.time())
          selected["_github_repository_env"] = os.getenv("GITHUB_REPOSITORY")
          selected["_github_workflow_ref_env"] = os.getenv("GITHUB_WORKFLOW_REF")
          selected["_github_run_id_env"] = os.getenv("GITHUB_RUN_ID")
          selected["_token_header"] = json.loads(b64url_decode(header_b64))

          with open(args.out, "w", encoding="utf-8") as f:
              json.dump(selected, f, indent=2, sort_keys=True)
          PY
          python3 capture_oidc_claims.py \
            --audience "$AUDIENCE" \
            --out "oidc-claims/${SCENARIO}__callee_reusable.json"
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-claims-callee-reusable-${{ inputs.scenario }}
          path: oidc-claims/*.json
